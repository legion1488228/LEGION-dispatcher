<!doctype html>
<html lang="ru">

  <title>ЛЕГИОН — Диспетчерская</title>
  <script src="https://telegram.org/js/telegram-web-app.js?63"></script>
  <style>
:root{

}

.date-strip{display:flex;gap:8px;overflow:auto;padding:6px 16px 13px;scrollbar-width:none}.date-strip::-webkit-scrollbar{display:none}.date-pill{min-width:78px;border:1px solid var(--line);background:var(--panel);color:var(--text);border-radius:14px;padding:9px 10px;text-align:center}.date-pill.active{border-color:var(--gold);background:#211d15}.date-pill strong{display:block;font-size:13px}.date-pill small{color:var(--muted);font-size:11px}.date-pill.active small{color:#d9c59a}
main{padding:0 14px}.summary-grid{display:grid;grid-template-columns:repeat(4,1fr);gap:8px;margin:4px 0 18px}.summary-grid.compact{grid-template-columns:repeat(3,1fr)}.metric{background:var(--panel);border:1px solid var(--line);border-radius:16px;padding:12px 10px;min-width:0}.metric b{font-size:20px;display:block}.metric span{font-size:10px;color:var(--muted);display:block;margin-top:4px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}.metric.warn b{color:var(--amber)}.metric.good b{color:var(--green)}
.view{display:none}.view.active{display:block}.section-head{display:flex;align-items:center;justify-content:space-between;margin:6px 2px 12px}.section-head h2{font-size:21px;margin:0}.muted{color:var(--muted);margin:4px 0 0;font-size:12px}
.primary{background:var(--gold);border:0;color:#171208;font-weight:800;border-radius:14px;padding:12px 16px}.primary.small{padding:9px 13px;font-size:13px}.primary:disabled{opacity:.35}.secondary{background:var(--panel2);border:1px solid var(--line);color:var(--text);font-weight:650;border-radius:14px;padding:11px 14px}.danger{border-color:#5a2d2d;color:#ffaaaa}
.segmented{display:grid;grid-template-columns:repeat(3,1fr);gap:4px;background:var(--panel);padding:4px;border:1px solid var(--line);border-radius:14px;margin-bottom:10px}.segmented.scroll{display:flex;overflow:auto}.segmented button{border:0;background:transparent;color:var(--muted);padding:8px 10px;border-radius:10px;font-weight:700;font-size:12px;white-space:nowrap}.segmented button.active{background:#2a251b;color:#f6dfac}
#employeeFilters button{display:inline-flex;align-items:center;gap:7px}
.employee-ready-count{display:inline-flex;align-items:center;justify-content:center;min-width:22px;height:22px;padding:0 6px;border-radius:999px;background:#1b3325;color:var(--green);font-size:11px;font-weight:850}
#employeeFilters button.active .employee-ready-count{background:#284330;color:#7ee0a2}
.status-row{display:flex;gap:6px;overflow:auto;margin-bottom:12px;scrollbar-width:none}.chip{border:1px solid var(--line);background:var(--panel);color:var(--muted);border-radius:999px;padding:7px 10px;font-size:11px;white-space:nowrap}.chip.active{color:#1b160c;background:var(--gold);border-color:var(--gold)}
.cards{display:flex;flex-direction:column;gap:10px}.order-card{background:var(--panel);border:1px solid var(--line);border-radius:18px;padding:14px;position:relative;overflow:hidden}.order-card.complete{border-color:#305c40}.order-card::before{content:"";position:absolute;left:0;top:0;bottom:0;width:3px;background:var(--gold2)}.order-card.complete::before{background:var(--green)}.order-top{display:flex;justify-content:space-between;gap:10px;align-items:flex-start}.order-time{font-size:20px;font-weight:850}.order-name{font-size:17px;font-weight:800;margin:3px 0 8px}.badges{display:flex;gap:5px;flex-wrap:wrap}.badge{font-size:10px;padding:4px 7px;border-radius:999px;background:#24242a;color:#ccc;border:1px solid #303038}.badge.gbu{background:#201d27;color:#d7c7f1}.badge.private{background:#17221c;color:#a9dfbd}.badge.vip{background:#2b2315;color:#f0d397}.badge.elite{background:#241c22;color:#edc7df}.order-number{font-size:12px;font-weight:850;color:var(--gold);margin-bottom:7px}.order-actions-top{display:flex;align-items:flex-start;gap:8px}.status-badge{font-size:10px;color:var(--muted);text-align:right;padding-top:4px}.delete-card-btn{width:34px;height:34px;border-radius:10px;border:1px solid #5a2d2d;background:#241616;color:#ffaaaa;font-size:15px;display:grid;place-items:center;padding:0}.order-foot{display:flex;justify-content:space-between;align-items:center;margin-top:12px;padding-top:10px;border-top:1px solid var(--line);font-size:12px}.order-foot .brig{max-width:65%;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}.progress{color:var(--muted)}.progress.done{color:var(--green)}
.bottom-nav{position:fixed;z-index:30;left:0;right:0;bottom:0;height:calc(68px + var(--safe-bottom));padding-bottom:var(--safe-bottom);display:grid;grid-template-columns:repeat(4,1fr);background:rgba(13,13,15,.95);backdrop-filter:blur(16px);border-top:1px solid var(--line)}.bottom-nav button{border:0;background:transparent;color:#777;padding:7px 2px}.bottom-nav button.active{color:var(--gold)}.bottom-nav span{display:block;font-size:18px;height:23px}.bottom-nav small{font-size:9px;font-weight:700}
.backdrop{position:fixed;inset:0;background:rgba(0,0,0,.62);z-index:50}.drawer{position:fixed;z-index:60;left:0;right:0;bottom:0;max-height:92vh;overflow:auto;background:#101013;border:1px solid var(--line);border-radius:24px 24px 0 0;padding:18px 16px calc(22px + var(--safe-bottom));box-shadow:0 -20px 80px rgba(0,0,0,.6)}.handle{width:42px;height:4px;background:#3a3a40;border-radius:5px;margin:0 auto 15px}.drawer h3{margin:0 0 2px;font-size:22px}.drawer-section{margin-top:18px}.drawer-section h4{font-size:12px;color:var(--muted);letter-spacing:.06em;text-transform:uppercase;margin:0 0 9px}.data-grid{display:grid;grid-template-columns:1fr 1fr;gap:8px}.data-item{background:var(--panel);border:1px solid var(--line);border-radius:13px;padding:10px}.data-item small{display:block;color:var(--muted);font-size:9px;margin-bottom:4px}.data-item b{font-size:13px}.full{grid-column:1/-1}.action-row{display:flex;gap:8px}.action-row>*{flex:1}.person-row{display:flex;align-items:center;gap:10px;padding:11px 3px;border-bottom:1px solid #24242a}.person-row:last-child{border:0}.person-main{min-width:0;flex:1}.person-main b{display:block;font-size:13px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}.person-main small{color:var(--muted);font-size:10px}.person-meta{font-size:11px;color:#cfcfd4;white-space:nowrap}.check{width:25px;height:25px;border:1px solid #4a4a52;border-radius:8px;display:grid;place-items:center;color:transparent}.person-row.selected .check{background:var(--green);border-color:var(--green);color:#07120b}.person-row.blocked{opacity:.4}.person-row.match{background:linear-gradient(90deg,rgba(216,180,106,.08),transparent)}
.modal{position:fixed;z-index:70;left:12px;right:12px;top:7vh;max-height:86vh;overflow:auto;background:#111114;border:1px solid var(--line);border-radius:22px;padding:16px;box-shadow:0 20px 90px #000}.modal h3{margin:2px 0 14px}.modal-head{display:flex;justify-content:space-between;align-items:center}.close-btn{border:0;background:var(--panel2);color:var(--text);border-radius:10px;width:34px;height:34px}.candidate-list{max-height:60vh;overflow:auto}.search{width:100%;background:var(--panel);border:1px solid var(--line);color:var(--text);border-radius:14px;padding:12px;margin:0 0 10px;outline:none}.search:focus{border-color:var(--gold2)}
.group-block{background:var(--panel);border:1px solid var(--line);border-radius:17px;margin:0 0 10px;overflow:hidden}.group-title{display:flex;justify-content:space-between;padding:13px;font-weight:800}.group-stats{display:grid;grid-template-columns:repeat(4,1fr);gap:5px;padding:0 10px 10px}.group-stats button{border:0;border-radius:10px;background:#1b1b1f;color:var(--muted);padding:8px 3px;font-size:10px;cursor:pointer}.group-stats button:active{transform:scale(.98);background:#26262c}.group-stats button.has-people{box-shadow:inset 0 0 0 1px #34343b}.group-stats b{display:block;font-size:15px;color:var(--text)}.group-details{padding:0 12px 10px}.status-section{margin-top:10px}.status-section h5{margin:0 0 6px;font-size:11px;color:var(--muted)}
.list{background:var(--panel);border:1px solid var(--line);border-radius:17px;overflow:hidden}.employee-row{display:flex;align-items:center;padding:11px 12px;border-bottom:1px solid var(--line);gap:10px}.employee-row:last-child{border:0}.employee-row .name{flex:1;min-width:0}.employee-row .name b{font-size:13px;display:block;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}.employee-row .name small{font-size:10px;color:var(--muted)}.car{font-size:14px}.height{font-size:12px;font-weight:800;color:#ddd}.contact-btns{display:flex;gap:6px;flex-wrap:wrap;margin-top:6px}.contact-btn{border:1px solid var(--line);background:#202026;color:#ddd;border-radius:9px;padding:5px 8px;font-size:10px}.contact-btn.telegram{color:#9fc8ff}.section-actions{display:flex;gap:6px;flex-wrap:wrap;justify-content:flex-end}.attention{background:#211a14;border:1px solid #4c3a28;border-radius:16px;padding:13px;margin-bottom:10px}.attention.red{background:#221616;border-color:#512c2c}.attention h4{margin:0 0 7px}.attention p{margin:5px 0;color:var(--muted);font-size:11px}.attention-list{display:flex;flex-direction:column;gap:5px;font-size:12px}
.form-grid{display:grid;grid-template-columns:1fr 1fr;gap:8px}.field{margin-bottom:9px}.field label{display:block;color:var(--muted);font-size:10px;margin:0 0 5px}.field input,.field select,.field textarea{width:100%;background:var(--panel);border:1px solid var(--line);color:var(--text);border-radius:11px;padding:10px}.field textarea{min-height:74px;resize:vertical}.gbu-draft{padding:12px;border:1px solid var(--line);border-radius:15px;margin-bottom:10px;background:var(--panel)}
.toast{position:fixed;z-index:100;left:20px;right:20px;bottom:calc(82px + var(--safe-bottom));padding:12px 14px;border-radius:14px;background:#25251f;border:1px solid #5b5036;color:#fff;text-align:center;font-size:12px}.fatal{position:fixed;z-index:200;inset:0;padding:60px 20px;background:#09090b;color:#fff}.fatal h2{color:var(--red)}
.empty{padding:32px 12px;text-align:center;color:var(--muted);font-size:13px}
@media(min-width:760px){body{max-width:960px;margin:auto}.drawer{left:50%;transform:translateX(-50%);max-width:680px}.modal{left:50%;right:auto;width:680px;transform:translateX(-50%)}.summary-grid{grid-template-columns:repeat(6,1fr)}}

</style>
</head>
<body>
  <div id="app">
    <header class="topbar">
      <div>
        <div class="eyebrow">ЛЕГИОН</div>
        <h1>Диспетчерская</h1>
      </div>
      <div style="display:flex;gap:8px"><button class="icon-btn hidden" id="cashBtn" aria-label="Касса">💰</button><button class="icon-btn" id="refreshBtn" aria-label="Обновить">↻</button></div>
    </header>

    <section class="date-strip" id="dateStrip"></section>

    <main>
      <section id="summary" class="summary-grid"></section>

      <section id="ordersView" class="view active">
        <div class="section-head">
          <div>
            <h2>Заказы</h2>
            <p id="ordersDateLabel" class="muted"></p>
          </div>
          <div class="section-actions">
            <button class="primary small" id="newOrderBtn">＋ Добавить заказ</button>
            <button class="secondary small" id="gbuBtn">＋ ГБУ</button>
          </div>
        </div>
        <div class="segmented" id="sourceFilters">
          <button data-source="all" class="active">Все</button>
          <button data-source="private">Частные</button>
          <button data-source="gbu">ГБУ</button>
        </div>
        <div class="status-row" id="statusFilters">
          <button data-status="all" class="chip active">Все</button>
          <button data-status="new" class="chip">Новые</button>
          <button data-status="assigning" class="chip">Расстановка</button>
          <button data-status="ready" class="chip">Готовы</button>
          <button data-status="sent" class="chip">Отправлены</button>
        </div>
        <div id="ordersList" class="cards"></div>
      </section>

      <section id="readinessView" class="view">
        <div class="section-head">
          <div><h2>Готовность</h2><p class="muted">Официальный срез — 15:30</p></div>
          <div class="section-actions"><button class="secondary small" id="readinessHistoryBtn">🧾 История</button><button class="primary small" id="readinessCountBtn">📊 Посчитать</button></div>
        </div>
        <div id="readinessSummary" class="summary-grid"></div>
        <div id="readinessGroups"></div>
      </section>

      <section id="employeesView" class="view">
        <div class="section-head"><div><h2>Сотрудники</h2><p class="muted">Рост, группа, авто, контакты</p></div><div class="section-actions"><button class="secondary small" id="gbuAgentsBtn">⬛ Агенты ГБУ</button><button class="primary small" id="employeeImportBtn">Импорт</button></div></div>
        <input id="employeeSearch" class="search" placeholder="Поиск по имени, метро и росту" />
        <div class="segmented scroll" id="employeeFilters">
          <button data-group="all" class="active"><span>Все</span><b class="employee-ready-count" data-ready-count="all">0</b></button>
          <button data-group="brigadier"><span>Бригадиры</span><b class="employee-ready-count" data-ready-count="brigadier">0</b></button>
          <button data-group="main"><span>Основной</span><b class="employee-ready-count" data-ready-count="main">0</b></button>
          <button data-group="cashless"><span>Безнал</span><b class="employee-ready-count" data-ready-count="cashless">0</b></button>
          <button data-group="reserve"><span>Резерв</span><b class="employee-ready-count" data-ready-count="reserve">0</b></button>
        </div>
        <div id="employeesList" class="list"></div>
      </section>

      <section id="controlView" class="view">
        <div class="section-head"><div><h2>Контроль</h2><p class="muted">Что требует внимания</p></div></div>
        <div id="controlContent"></div>
      </section>
    </main>

    <nav class="bottom-nav">
      <button data-view="ordersView" class="active"><span>▤</span><small>Заказы</small></button>
      <button data-view="readinessView"><span>✓</span><small>Готовность</small></button>
      <button data-view="employeesView"><span>👥</span><small>Сотрудники</small></button>
      <button data-view="controlView"><span>!</span><small>Контроль</small></button>
    </nav>
  </div>

  <div id="drawerBackdrop" class="backdrop hidden"></div>
  <aside id="orderDrawer" class="drawer hidden"></aside>

  <div id="modalBackdrop" class="backdrop hidden"></div>
  <div id="modal" class="modal hidden"></div>

  <div id="toast" class="toast hidden"></div>
  <div id="fatal" class="fatal hidden"></div>

  <script>
const tg = window.Telegram?.WebApp;
if (tg) { tg.ready(); tg.expand(); }

const state = {
  selectedDate: null,
  source: 'all',
  status: 'all',
  employeeGroup: 'all',
  employeeSearch: '',
  bootstrap: null,
  currentOrder: null,
};

const qs = (s, root=document) => root.querySelector(s);
const qsa = (s, root=document) => [...root.querySelectorAll(s)];
const fmtDate = (iso) => new Date(`${iso}T12:00:00`).toLocaleDateString('ru-RU',{day:'2-digit',month:'long',weekday:'short'});
const fmtMonthYear = (iso) => {
  const s = new Date(`${iso}T12:00:00`).toLocaleDateString('ru-RU',{month:'long',year:'numeric'});
  return s.charAt(0).toUpperCase()+s.slice(1);
};
const dayNumber = (iso) => String(new Date(`${iso}T12:00:00`).getDate());
const esc = (s='') => String(s).replace(/[&<>'"]/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;',"'":'&#39;','"':'&quot;'}[c]));

async function copyText(value, showToast=true){
  if(!value) return false;
  try{
    if(navigator.clipboard?.writeText){
      await navigator.clipboard.writeText(value);
    }else{
      const ta=document.createElement('textarea');
      ta.value=value;
      ta.setAttribute('readonly','');
      ta.style.position='fixed';
      ta.style.opacity='0';
      document.body.appendChild(ta);
      ta.select();
      const ok=document.execCommand('copy');
      ta.remove();
      if(!ok) throw new Error('copy failed');
    }
    if(showToast) toast('Скопировано');
    return true;
  }catch(e){
    window.prompt('Скопируйте:',value);
    return false;
  }
}

function visibleOrderNumber(o){
  return o?.display_number || o?.daily_number || o?.id || '—';
}

function telegramOrderText(o){
  const dateText=o.work_date ? o.work_date.split('-').reverse().join('.') : '—';
  const lines=[
    `Заказ №${visibleOrderNumber(o)}`,
    `Дата: ${dateText}`,
    `Категория заказа: ${o.category_label||'—'}`,
    `Агент: ${o.agent_name||'—'}`,
    `Номер агента: ${o.agent_phone||'—'}`,
    `Время подачи: ${o.arrival_time||'—'}`,
    `Время выдачи: ${o.issue_time||'—'}`,
    `ФИО умершего: ${o.deceased_name||'—'}`,
    `Маршрут: ${o.route||'—'}`,
    `Количество человек: ${o.team_size||'—'} чел.`
  ];

  if(o.organization) lines.push(`Организация: ${o.organization}`);
  if(o.other_agent_phone) lines.push(`Номер другого агента: ${o.other_agent_phone}`);
  if(o.notes) lines.push(`Примечание: ${o.notes}`);
  if(o.kickback_rub) lines.push(`Откат: ${o.kickback_rub} ₽`);

  lines.push('', 'Состав:');
  lines.push(`Бригадир: ${o.brigadier ? (o.brigadier.display_name||o.brigadier.full_name) : '—'}`);
  if(o.members?.length){
    o.members.forEach((x,i)=>lines.push(`${i+1}. ${x.display_name||x.full_name}`));
  }else{
    lines.push('Сотрудники: —');
  }
  return lines.join('\n');
}
function contactButtons(x){
  const out=[];
  if(x.phone) out.push(`<button class="contact-btn" data-copy-phone="${esc(x.phone)}">📋 ${esc(x.phone)}</button>`);
  if(x.telegram_url) out.push(`<button class="contact-btn telegram" data-open-tg="${esc(x.telegram_url)}">Telegram ↗</button>`);
  return out.length?`<div class="contact-btns">${out.join('')}</div>`:'';
}
function wireContactButtons(root=document){
  qsa('[data-copy-phone]',root).forEach(b=>b.onclick=e=>{e.stopPropagation();copyText(b.dataset.copyPhone)});
  qsa('[data-open-tg]',root).forEach(b=>b.onclick=e=>{e.stopPropagation();const u=b.dataset.openTg;if(u.startsWith('https://t.me/')&&tg?.openTelegramLink)tg.openTelegramLink(u);else window.location.href=u});
}

function headers(json=true) {
  const h = {};
  if (json) h['Content-Type'] = 'application/json';
  const init = tg?.initData || '';
  if (init) h['X-Telegram-Init-Data'] = init;
  const p = new URLSearchParams(location.search);
  if (p.get('dev_uid')) h['X-Dev-Telegram-Id'] = p.get('dev_uid');
  return h;
}

async function api(path, opts={}) {
  const isForm = opts.body instanceof FormData;
  const response = await fetch(path, {...opts, headers:{...headers(!isForm), ...(opts.headers||{})}});
  const contentType = response.headers.get('content-type') || '';
  const data = contentType.includes('application/json') ? await response.json() : await response.text();
  if (!response.ok) {
    const msg = data?.detail || data?.message || String(data) || `Ошибка ${response.status}`;
    throw new Error(msg);
  }
  return data;
}

function toast(msg, timeout=2500) {
  const el = qs('#toast'); el.textContent = msg; el.classList.remove('hidden');
  clearTimeout(window.__toastTimer); window.__toastTimer = setTimeout(()=>el.classList.add('hidden'), timeout);
}

function fatal(msg) {
  const el = qs('#fatal');
  el.innerHTML = `<h2>Доступ к диспетчерской</h2><p>${esc(msg)}</p><p class="muted">Mini App доступна только владельцу и помощникам, чьи Telegram ID указаны в настройках сервера.</p>`;
  el.classList.remove('hidden');
}

function statusColorClass(o) { return o.composition_complete ? 'complete' : ''; }

async function loadBootstrap(date=null) {
  const suffix = date ? `?work_date=${date}` : '';
  const data = await api(`/api/bootstrap${suffix}`);
  state.bootstrap = data;
  state.selectedDate = data.selected_date;
  const cashBtn=qs('#cashBtn'); if(cashBtn) cashBtn.classList.toggle('hidden', !data.is_owner);
  renderDates(); renderSummary();
  await renderCurrentView();
}

function renderDates() {
  const el = qs('#dateStrip');
  el.innerHTML = state.bootstrap.dates.map(d => `
    <button class="date-pill ${d.date===state.selectedDate?'active':''}" data-date="${d.date}">
      <strong>${esc(d.label)}</strong><small>${d.count} заказов</small>
    </button>`).join('');
  qsa('.date-pill', el).forEach(btn => btn.onclick = async () => {
    state.selectedDate = btn.dataset.date;

    </article>`).join('');

  qsa('.order-card', el).forEach(card => card.onclick = () => openOrder(Number(card.dataset.orderId)));

async function deleteOrderCompletely(id, displayNumber=null) {
  const shown=displayNumber || id;
  if (!confirm(`Удалить заказ №${shown} полностью?\n\nЗаказ и назначенный состав будут удалены без возможности восстановления.`)) return false;
  try {
    await api(`/api/orders/${id}`, {method:'DELETE'});
    if (state.currentOrder && Number(state.currentOrder.id) === Number(id)) closeDrawer();
    toast(`Заказ №${shown} удалён`);
    await loadBootstrap(state.selectedDate);
    return true;
  } catch(e) {
    toast(e.message, 4000);
    return false;
  }
}

async function openOrder(id) {

function wireOrderDrawer(o) {
  wireContactButtons(qs('#orderDrawer'));
  qs('#closeDrawer').onclick = closeDrawer;
  qs('#assignBrigBtn').onclick = ()=>openBrigadierModal(o.id);
  qs('#selectMembersBtn').onclick = ()=>openMembersModal(o.id);
  qs('#manualCompositionBtn').onclick = ()=>openManualCompositionModal(o.id);
  qs('#copyOrderBtn').onclick = async ()=>{
    const ok=await copyText(telegramOrderText(o), false);
    toast(ok ? 'Заказ скопирован для Telegram' : 'Текст подготовлен для копирования', 3000);
  };
  qs('#addOrderBtn').onclick = ()=>{
    closeDrawer();
    openManualOrder();
  };
  qs('#editOrderBtn').onclick = ()=>openEditOrderModal(o);
  qs('#cancelOrderBtn').onclick = async ()=>{
    if (['cancelled','closed'].includes(o.status)) return;
    if (!confirm(`Отменить заказ ${o.deceased_name}? Состав будет освобождён.`)) return;
    try {await api(`/api/orders/${o.id}/cancel`,{method:'POST'});toast('Заказ отменён');closeDrawer();await loadBootstrap(state.selectedDate)} catch(e){toast(e.message,3500)}
  };
  qs('#deleteOrderBtn').onclick = async ()=>{ await deleteOrderCompletely(o.id); };
  qs('#resetCompositionBtn').onclick = async ()=>{
    if (!confirm('Снять бригадира и весь состав с этого заказа?')) return;
    await api(`/api/orders/${o.id}/reset-composition`,{method:'POST'}); toast('Состав снят'); await refreshOrder(o.id);
  };
  qs('#finalizeBtn').onclick = async ()=>{
    try {
      const r = await api(`/api/orders/${o.id}/finalize`,{method:'POST'});
      toast(r.telegram_sent?'Заказ отправлен бригадиру':'Состав сохранён. '+(r.warning||''),3500);
      await refreshOrder(o.id);
    } catch(e){toast(e.message,3500)}
  };
}

  };

async function openManualCompositionModal(orderId) {
  const data = await api(`/api/orders/${orderId}/manual-composition`);
  if(!data.brigadiers.length){toast('В списке нет зарегистрированных бригадиров');return}
  const selected = new Set((data.member_ids||[]).map(Number));
  const brigOptions = data.brigadiers.map(x=>`<option value="${x.id}" ${Number(data.brigadier_id)===Number(x.id)?'selected':''}>${esc(x.display_name||x.full_name)} · ${x.workload}/2</option>`).join('');
  showModal('✍️ Ручное заполнение состава', `
    <p class="muted">Можно выбрать сотрудников вручную, даже если они не отмечали «Готов». Ограничение — не более 2 заказов на человека в день.</p>
    <div class="field full"><label>Бригадир</label><select id="manualBrigSelect">${brigOptions}</select></div>
    <div class="drawer-section"><h4>Сотрудники · нужно <span id="manualNeedCount">${data.target}</span></h4>
      <input class="search" id="manualMemberSearch" placeholder="Поиск сотрудника">
      <div class="candidate-list" id="manualMemberList"></div>
    </div>
    <div class="attention"><p>Выбрано: <b id="manualSelectedCount">0</b> / ${data.target}</p></div>
    <button class="primary" id="saveManualComposition" style="width:100%">Сохранить состав</button>`);

  const brigSelect=qs('#manualBrigSelect');
  const memberList=qs('#manualMemberList');
  const selectedCount=qs('#manualSelectedCount');
  const search=qs('#manualMemberSearch');

  function renderManualMembers(){
    const brigId=Number(brigSelect.value);
    if(selected.has(brigId)) selected.delete(brigId);
    const q=(search.value||'').trim().toLowerCase();
    const rows=(data.members||[]).filter(x=>Number(x.id)!==brigId && (!q || `${x.display_name||x.full_name} ${x.group_label}`.toLowerCase().includes(q)));
    memberList.innerHTML=rows.length?rows.map(x=>`<div class="person-row ${selected.has(Number(x.id))?'selected':''} ${x.blocked&&!selected.has(Number(x.id))?'blocked':''}" data-manual-member="${x.id}">
      <div class="check">✓</div><div class="person-main"><b>${esc(x.display_name||x.full_name)}</b><small>${esc(x.group_label)} · ${x.workload}/2 заказа${x.readiness_status==='ready'?' · ✅ готов':''}</small>${contactButtons(x)}</div><div class="person-meta">${x.height_cm||'—'} см ${x.has_car?'🚗':''}</div></div>`).join(''):'<div class="empty">Не найдено</div>';
    selectedCount.textContent=String(selected.size);
    wireContactButtons(memberList);
    qsa('[data-manual-member]',memberList).forEach(row=>row.onclick=e=>{
      if(e.target.closest('.contact-btn')) return;
      const id=Number(row.dataset.manualMember);
      if(selected.has(id)){selected.delete(id);renderManualMembers();return}
      if(selected.size>=Number(data.target)){toast(`Нужно выбрать ${data.target} сотрудников`);return}
      if(row.classList.contains('blocked')){toast('У сотрудника уже 2 заказа');return}
      selected.add(id);renderManualMembers();
    });
  }
  brigSelect.onchange=renderManualMembers;
  search.oninput=renderManualMembers;
  renderManualMembers();

  qs('#saveManualComposition').onclick=async()=>{
    if(selected.size!==Number(data.target)){toast(`Выберите ровно ${data.target} сотрудников`);return}
    try{
      await api(`/api/orders/${orderId}/manual-composition`,{method:'POST',body:JSON.stringify({brigadier_id:Number(brigSelect.value),member_ids:[...selected]})});
      closeModal();toast('Состав сохранён вручную');await refreshOrder(orderId);
    }catch(e){toast(e.message,4500)}
  };
}

async function loadReadiness(){
  const r=await api(`/api/readiness/summary?work_date=${state.selectedDate}`);

  const groupEntries=Object.entries(r.groups||{});
  const currentNoResponse=groupEntries.reduce((sum,[,g])=>sum+Number(g?.counts?.no_response||0),0);
  const respondedNow=groupEntries.reduce((sum,[,g])=>
    sum
    + Number(g?.counts?.ready||0)
    + Number(g?.counts?.not_ready||0)
    + Number(g?.counts?.day_off||0)
    + Number(g?.counts?.responded||0)
  ,0);

  qs('#readinessSummary').innerHTML=`
    <div class="metric"><b>${r.totals.employees}</b><span>Сотрудников</span></div>
    <div class="metric good"><b>${r.totals.ready_cutoff}</b><span>Готовы 15:30</span></div>
    <div class="metric"><b>${r.totals.ready_now}</b><span>Готовы сейчас</span></div>
    <div class="metric ${currentNoResponse?'warn':''}"><b>${currentNoResponse}</b><span>Не отписались</span></div>`;

  qs('#readinessGroups').innerHTML=groupEntries.map(([code,g])=>{
    const ready=Number(g.counts.ready||0);
    const mainJob=Number(g.counts.not_ready||0);
    const dayOff=Number(g.counts.day_off||0);
    const free=Number(g.counts.responded||0);
    const noResponse=Number(g.counts.no_response||0);
    const answered=ready+mainJob+dayOff+free;
    const total=answered+noResponse;

    if(code==='reserve'){
      const wrotePeople=[
        ...(g.ready||[]),
        ...(g.responded||[]),
        ...(g.not_ready||[]),
        ...(g.day_off||[])
      ];
      return `<div class="group-block">
        <div class="group-title"><span>${esc(g.label)}</span><span>${answered}/${total}</span></div>
        <div class="group-stats">
          <button class="${wrotePeople.length?'has-people':''}" data-rgroup="${code}" data-rstatus="wrote"><b>${wrotePeople.length}</b>Отписались</button>
          <button class="${ready?'has-people':''}" data-rgroup="${code}" data-rstatus="ready"><b>${ready}</b>Готовы</button>
          <button class="${free?'has-people':''}" data-rgroup="${code}" data-rstatus="responded"><b>${free}</b>Свободная</button>
          <button class="${noResponse?'has-people':''}" data-rgroup="${code}" data-rstatus="no_response"><b>${noResponse}</b>Не отпис.</button>
        </div>
      </div>`;
    }

    return `<div class="group-block">
      <div class="group-title"><span>${esc(g.label)}</span><span>${answered}/${total}</span></div>
      <div class="group-stats">
        <button class="${ready?'has-people':''}" data-rgroup="${code}" data-rstatus="ready"><b>${ready}</b>Готов</button>
        <button class="${mainJob?'has-people':''}" data-rgroup="${code}" data-rstatus="not_ready"><b>${mainJob}</b>На основной</button>
        <button class="${dayOff?'has-people':''}" data-rgroup="${code}" data-rstatus="day_off"><b>${dayOff}</b>Выходной</button>
        <button class="${noResponse?'has-people':''}" data-rgroup="${code}" data-rstatus="no_response"><b>${noResponse}</b>Не отпис.</button>
      </div>
    </div>`;
  }).join('');

  qsa('[data-rgroup]',qs('#readinessGroups')).forEach(btn=>{
    btn.onclick=()=>{
      const code=btn.dataset.rgroup;
      const status=btn.dataset.rstatus;
      const g=r.groups?.[code]||{};
      let people=[];
      let label='';

      if(status==='ready'){people=g.ready||[];label='Готов';}
      else if(status==='not_ready'){people=g.not_ready||[];label='На основной';}
      else if(status==='day_off'){people=g.day_off||[];label='Выходной';}
      else if(status==='responded'){people=g.responded||[];label='Свободная';}
      else if(status==='no_response'){people=g.no_response||[];label='Не отписались';}
      else if(status==='wrote'){
        people=[
          ...(g.ready||[]),
          ...(g.responded||[]),
          ...(g.not_ready||[]),
          ...(g.day_off||[])
        ];
        label='Отписались';
      }

      openReadinessPeople(g.label||code,label,people);
    };
  });
}

async function loadEmployees(){
  const params=state.employeeGroup==='all'?'':`?group=${state.employeeGroup}`;

  const [list, readiness] = await Promise.all([
    api(`/api/employees${params}`),
    api(`/api/readiness/summary?work_date=${state.selectedDate}`)
  ]);

  const counts = {
    all: Number(readiness?.totals?.ready_now || 0),
    brigadier: Number(readiness?.groups?.brigadier?.counts?.ready || 0),
    main: Number(readiness?.groups?.main?.counts?.ready || 0),
    cashless: Number(readiness?.groups?.cashless?.counts?.ready || 0),
    reserve: Number(readiness?.groups?.reserve?.counts?.ready || 0),
  };

  qsa('[data-ready-count]').forEach(el=>{
    const group=el.dataset.readyCount;
    el.textContent=String(counts[group] ?? 0);
  });

  const v=(state.employeeSearch||'').trim().toLowerCase();
  const ownerTgId=Number(state.bootstrap?.user?.id||0);

  const filtered=list
    .filter(x=>{
      if(!v) return true;
      const haystack=[
        x.full_name,
        x.display_name,
        x.metro,
        x.height_cm,
      ].filter(Boolean).join(' ').toLowerCase();
      return haystack.includes(v);
    })
    .sort((a,b)=>{
      const aOwner=ownerTgId && Number(a.tg_id||0)===ownerTgId;
      const bOwner=ownerTgId && Number(b.tg_id||0)===ownerTgId;
      if(aOwner!==bOwner) return aOwner ? -1 : 1;
      return String(a.display_name||a.full_name||'').localeCompare(
        String(b.display_name||b.full_name||''),
        'ru',
        {sensitivity:'base'}
      );
    });

  qs('#employeesList').innerHTML=filtered.length
    ? filtered.map((x,i)=>`
      <div class="employee-row">
        <div class="name">
          <b>${i+1}. ${esc(x.display_name||x.full_name)}</b>
          <small>${esc(x.group_label)}${x.telegram_username?` · @${esc(x.telegram_username)}`:''}</small>
          ${contactButtons(x)}
        </div>
        <div class="height">${x.height_cm||'—'} см</div>
        <div class="car">${x.has_car?'🚗':''}</div>
      </div>
    `).join('')
    : `<div class="empty">Ничего не найдено</div>`;

  wireContactButtons(qs('#employeesList'));
}

async function saveManualOrder(){
  const get=id=>qs(id)?.value?.trim()||'';
  const source=get('#manualSource')||'private';
  const payload={
    source,
    work_date:get('#manualWorkDate'),
    category:source==='gbu'?'standard':get('#manualCategory'),
    agent_name:get('#manualAgentName'),
    agent_phone:get('#manualAgentPhone'),
    arrival_time:get('#manualArrivalTime')||null,
    issue_time:get('#manualIssueTime'),
    deceased_name:get('#manualDeceasedName'),
    route:get('#manualRoute'),
    team_size:Number(get('#manualTeamSize')||4),
    organization:source==='gbu'?'ГБУ':'',
    notes:''
  };
  const missing=[];
  if(!payload.work_date) missing.push('дата');
  if(!payload.agent_name) missing.push('агент');
  if(!payload.agent_phone) missing.push('номер агента');
  if(!payload.arrival_time) missing.push('время подачи');
  if(!payload.issue_time) missing.push('время выдачи');
  if(!payload.deceased_name) missing.push('ФИО умершего');
  if(!payload.route) missing.push('маршрут');
  if(missing.length){toast('Заполните: '+missing.join(', '),4500);return}
  const btn=qs('#saveManualOrderBtn');
  btn.disabled=true;btn.textContent='Сохраняю…';
  try{
    const created=await api('/api/orders',{method:'POST',body:JSON.stringify(payload)});
    closeModal();
    state.selectedDate=created.work_date||payload.work_date;
    toast(`Создан заказ №${created.id}`);
    await loadBootstrap(state.selectedDate);
  }catch(e){
    toast(e.message,4500);
    btn.disabled=false;btn.textContent='Сохранить новый заказ';
  }
}

  async function drawCash(){
    const body=qs('#cashTableBody');
    if(!body) return;
    try{
      const [ledger, selectedDay]=await Promise.all([
        api(`/api/cash/ledger?on_date=${state.selectedDate}`),
        api(`/api/cash?work_date=${state.selectedDate}`)
      ]);
      if(!qs('#cashTableBody')) return;

      const brigadiers=ledger.brigadiers||[];
      const days=ledger.days||[];
      const totalsByBrig=new Map((ledger.brigadier_totals||[]).map(x=>[String(x.brigadier_tg_id),x]));

      const matrix=brigadiers.length ? `
        <div style="overflow:auto;border:1px solid var(--line);border-radius:16px;margin:10px 0 12px">
          <table style="border-collapse:separate;border-spacing:0;min-width:max-content;width:100%;font-size:11px">
            <thead>
              <tr>
                <th style="position:sticky;left:0;z-index:3;background:#18181c;padding:10px 6px;border-bottom:1px solid var(--line);text-align:center;min-width:42px">День</th>
                ${brigadiers.map(b=>`<th style="background:#18181c;padding:10px;border-bottom:1px solid var(--line);min-width:120px">${esc(b.name)}</th>`).join('')}
                <th style="position:sticky;right:0;z-index:3;background:#211d15;color:var(--gold);padding:10px;border-bottom:1px solid var(--line);min-width:130px">Итого за день</th>
              </tr>
            </thead>
            <tbody>
              ${days.map(day=>`
                <tr>
                  <td style="position:sticky;left:0;z-index:2;background:#121215;padding:9px 6px;border-bottom:1px solid var(--line);font-weight:900;text-align:center;min-width:42px">${dayNumber(day.work_date)}</td>
                  ${(day.cells||[]).map(cell=>`
                    <td style="padding:8px 10px;border-bottom:1px solid var(--line);text-align:center">
                      <b>${cell.commission_rub?rub(cell.commission_rub):'—'}</b>
                      ${cell.kickback_rub?`<small style="display:block;color:var(--muted);margin-top:3px">откат ${rub(cell.kickback_rub)}</small>`:''}
                    </td>
                  `).join('')}
                  <td style="position:sticky;right:0;z-index:2;background:#19170f;padding:8px 10px;border-bottom:1px solid var(--line);text-align:center">
                    <b style="color:var(--gold)">${rub(day.day?.commission_rub||0)}</b>
                    <small style="display:block;color:var(--muted);margin-top:3px">откат ${rub(day.day?.kickback_rub||0)}</small>
                  </td>
                </tr>
              `).join('')}
              <tr>
                <td style="position:sticky;left:0;z-index:2;background:#1b1b1f;padding:10px;font-weight:900">Итого</td>
                ${brigadiers.map(b=>{
                  const t=totalsByBrig.get(String(b.tg_id))||{};
                  return `<td style="background:#1b1b1f;padding:10px;text-align:center"><b>${rub(t.commission_rub||0)}</b><small style="display:block;color:var(--muted);margin-top:3px">откат ${rub(t.kickback_rub||0)}</small></td>`
                }).join('')}
                <td style="position:sticky;right:0;z-index:3;background:#2a251b;padding:10px;text-align:center"><b style="color:var(--gold)">${rub(ledger.period?.commission_rub||0)}</b><small style="display:block;color:var(--muted);margin-top:3px">откат ${rub(ledger.period?.kickback_rub||0)}</small></td>
              </tr>
            </tbody>
          </table>
        </div>
      ` : '<div class="empty">Кассовые бригадиры пока не добавлены</div>';

      const dayRows=(selectedDay.rows||[]).map(x=>`
        <div class="employee-row">
          <div class="name">
            <b>${esc(x.brigadier_name)}</b>
            <small>${esc(x.category_label)} · ${x.team_size} чел${x.reserve_count?` · резерв ${x.reserve_count}`:''}</small>
            <div class="muted">Касса ${rub(x.commission_rub)} · откат отдельно ${rub(x.kickback_rub)}</div>
          </div>
          <button class="contact-btn danger" data-cash-del="${x.id}">Удалить</button>
        </div>
      `).join('');

      body.innerHTML=`
        <div class="summary-grid compact">
          <div class="metric good"><b>${rub(ledger.period?.commission_rub||0)}</b><span>Касса периода</span></div>
          <div class="metric"><b>${rub(ledger.period?.kickback_rub||0)}</b><span>Откат отдельно</span></div>
        </div>
        <div class="attention">
          <h4>${fmtMonthYear(ledger.start)}</h4>
          <p>Период: ${dayNumber(ledger.start)}–${dayNumber(ledger.end)}. Каждый столбец — отдельный бригадир.</p>
        </div>
        ${matrix}
        <div class="section-head" style="margin-top:16px">
          <div><h2 style="font-size:16px">Записи за ${fmtDate(state.selectedDate)}</h2><p class="muted">Детализация выбранного дня</p></div>
          <button class="secondary" id="cashRefreshNow">↻</button>
        </div>
        <div class="list">${dayRows||'<div class="empty">На выбранную дату записей нет</div>'}</div>
      `;

      qsa('[data-cash-del]',body).forEach(btn=>btn.onclick=async()=>{
        if(!confirm('Удалить запись кассы?')) return;
        await api(`/api/cash/${btn.dataset.cashDel}`,{method:'DELETE'});
        toast('Удалено');
        await drawCash();
      });
      const refresh=qs('#cashRefreshNow');
      if(refresh) refresh.onclick=drawCash;
    }catch(e){
      if(qs('#cashTableBody')) qs('#cashTableBody').innerHTML=`<div class="empty">${esc(e.message)}</div>`;
    }
  }

  await drawCash();
  cashRefreshTimer=setInterval(()=>{
    if(qs('#cashTableBody')) drawCash();
  },10000);
}

// Events
qs('#cashBtn').onclick=openCashTable;
qs('#refreshBtn').onclick=()=>loadBootstrap(state.selectedDate).catch(e=>toast(e.message));
qs('#drawerBackdrop').onclick=closeDrawer; qs('#modalBackdrop').onclick=closeModal; qs('#newOrderBtn').onclick=openManualOrder; qs('#gbuBtn').onclick=openGbuImport;
qsa('.bottom-nav button').forEach(btn=>btn.onclick=async()=>{qsa('.bottom-nav button').forEach(x=>x.classList.remove('active'));btn.classList.add('active');qsa('.view').forEach(x=>x.classList.remove('active'));qs(`#${btn.dataset.view}`).classList.add('active');await renderCurrentView()});
qsa('#sourceFilters button').forEach(btn=>btn.onclick=async()=>{qsa('#sourceFilters button').forEach(x=>x.classList.remove('active'));btn.classList.add('active');state.source=btn.dataset.source;await loadOrders()});
qsa('#statusFilters button').forEach(btn=>btn.onclick=async()=>{qsa('#statusFilters button').forEach(x=>x.classList.remove('active'));btn.classList.add('active');state.status=btn.dataset.status;await loadOrders()});
qsa('#employeeFilters button').forEach(btn=>btn.onclick=async()=>{qsa('#employeeFilters button').forEach(x=>x.classList.remove('active'));btn.classList.add('active');state.employeeGroup=btn.dataset.group;await loadEmployees()});
qs('#employeeSearch').oninput=e=>{state.employeeSearch=e.target.value;loadEmployees()};
qs('#employeeImportBtn').onclick=openEmployeeImport;
qs('#gbuAgentsBtn').onclick=openGbuAgents;
qs('#readinessCountBtn').onclick=refreshReadinessCount;
qs('#readinessHistoryBtn').onclick=openReadinessHistory;

async function autoRefresh(){
  if(document.hidden) return;
  if(!qs('#modal').classList.contains('hidden')) return;
  try{
    state.bootstrap=await api(`/api/bootstrap?work_date=${state.selectedDate}`); const cashBtn=qs('#cashBtn'); if(cashBtn) cashBtn.classList.toggle('hidden', !state.bootstrap.is_owner); renderSummary(); renderDates();
    await renderCurrentView();
    if(state.currentOrder && !qs('#orderDrawer').classList.contains('hidden')){
      const fresh=await api(`/api/orders/${state.currentOrder.id}`); state.currentOrder=fresh; qs('#orderDrawer').innerHTML=orderDrawerHtml(fresh); wireOrderDrawer(fresh);
    }
  }catch(e){}
}
setInterval(autoRefresh,10000);

loadBootstrap().catch(e=>fatal(e.message));

</script>
</body>
</html>
