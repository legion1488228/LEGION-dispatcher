<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8"/>
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no"/>
<title>ЛЕГИОН — Диспетчерская</title>
<script src="https://telegram.org/js/telegram-web-app.js"></script>
<style>
:root{--bg:#0f1115;--card:#171a21;--line:#292e39;--txt:#f2f3f5;--muted:#9aa3b2;--gold:#d3ad5b;--green:#2dbf73;--red:#ef6262;--blue:#5794ff}
*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--txt);font:15px -apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;padding-bottom:80px}.top{position:sticky;top:0;z-index:20;background:rgba(15,17,21,.96);backdrop-filter:blur(10px);border-bottom:1px solid var(--line);padding:12px}.title{font-size:20px;font-weight:800;letter-spacing:.4px}.date{display:flex;gap:8px;margin-top:9px}.date input{flex:1;background:var(--card);color:var(--txt);border:1px solid var(--line);border-radius:10px;padding:10px}.btn{border:1px solid var(--line);background:#222733;color:var(--txt);border-radius:10px;padding:9px 11px;font-weight:700}.btn.gold{background:var(--gold);color:#111;border-color:var(--gold)}.btn.green{background:var(--green);color:#07170f;border-color:var(--green)}.btn.red{background:#392020;color:#ffd5d5;border-color:#6f3030}.btn.small{font-size:12px;padding:7px 8px}.tabs{display:flex;gap:6px;overflow:auto;padding:10px 12px;border-bottom:1px solid var(--line)}.tab{white-space:nowrap;padding:8px 11px;border-radius:999px;background:#1a1e26;color:var(--muted);border:1px solid var(--line)}.tab.active{color:#111;background:var(--gold);border-color:var(--gold);font-weight:800}.wrap{padding:12px}.section{display:none}.section.active{display:block}.card{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:12px;margin-bottom:10px}.row{display:flex;justify-content:space-between;gap:10px;align-items:center}.muted{color:var(--muted)}.big{font-size:22px;font-weight:800}.chips{display:flex;gap:6px;flex-wrap:wrap;margin-top:8px}.chip{padding:6px 8px;border-radius:8px;background:#222733;font-size:12px}.grid{display:grid;grid-template-columns:1fr 1fr;gap:8px}.metric{background:#1c2028;border:1px solid var(--line);border-radius:12px;padding:10px}.metric b{display:block;font-size:21px;margin-top:3px}.metric.click{cursor:pointer}.order h3{margin:0 0 8px}.order .meta{line-height:1.5}.actions{display:flex;gap:7px;flex-wrap:wrap;margin-top:10px}.problem{border-left:4px solid var(--red)}.ok{border-left:4px solid var(--green)}.person{padding:10px 0;border-bottom:1px solid var(--line)}.person:last-child{border-bottom:0}.modal{display:none;position:fixed;inset:0;z-index:50;background:rgba(0,0,0,.68);padding:18px;overflow:auto}.modal.open{display:block}.modalbox{max-width:560px;margin:20px auto;background:var(--card);border:1px solid var(--line);border-radius:16px;padding:14px}.modal h2{margin-top:0}.field{margin:9px 0}.field label{display:block;color:var(--muted);font-size:12px;margin-bottom:5px}.field input,.field select,.field textarea{width:100%;padding:10px;border-radius:10px;border:1px solid var(--line);background:#11151b;color:var(--txt)}.selectperson{display:flex;gap:8px;align-items:center;padding:8px;border-bottom:1px solid var(--line)}.toast{position:fixed;bottom:85px;left:12px;right:12px;z-index:80;padding:11px;border-radius:12px;background:#262c37;border:1px solid var(--line);display:none}.bottom{position:fixed;bottom:0;left:0;right:0;background:rgba(15,17,21,.97);border-top:1px solid var(--line);padding:9px 12px;z-index:30}.bottom .row{justify-content:center}.hidden{display:none!important}
</style>
</head>
<body>
<div class="top"><div class="title">ЛЕГИОН · Диспетчерская V28</div><div class="date"><input id="day" type="date"><button class="btn" onclick="reloadAll()">Обновить</button></div></div>
<div class="tabs" id="tabs"></div>
<div class="wrap">
<section id="overview" class="section active"></section>
<section id="readiness" class="section"></section>
<section id="private" class="section"></section>
<section id="gbu" class="section"></section>
<section id="employees" class="section"></section>
<section id="control" class="section"></section>
<section id="cash" class="section"></section>
<section id="salary" class="section"></section>
</div>
<div class="modal" id="modal"><div class="modalbox" id="modalbox"></div></div>
<div class="toast" id="toast"></div>
<div class="bottom"><div class="row"><span class="muted" id="who">Проверка доступа…</span></div></div>
<script>
const tg=window.Telegram?.WebApp; if(tg){tg.ready();tg.expand();}
let me=null,dashboard=null,employees=[];
const tabs=[['overview','Сегодня'],['readiness','Готовность'],['private','Частные'],['gbu','ГБУ'],['employees','Сотрудники'],['control','Контроль'],['cash','Касса'],['salary','Зарплата']];
function hdr(){const h={'Content-Type':'application/json'}; if(tg?.initData)h['X-Telegram-Init-Data']=tg.initData; const p=new URLSearchParams(location.search); if(p.get('dev_uid'))h['X-Telegram-User-Id']=p.get('dev_uid'); return h;}
async function api(url,opt={}){opt.headers={...hdr(),...(opt.headers||{})};const r=await fetch(url,opt);if(!r.ok){let t=await r.text();throw new Error(t||r.statusText)}return r.status===204?null:r.json()}
function esc(x){return String(x??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]))}
function toast(s){const e=document.getElementById('toast');e.textContent=s;e.style.display='block';setTimeout(()=>e.style.display='none',2600)}
function setTab(id){document.querySelectorAll('.section').forEach(x=>x.classList.toggle('active',x.id===id));document.querySelectorAll('.tab').forEach(x=>x.classList.toggle('active',x.dataset.id===id));if(id==='employees')loadEmployees();if(id==='control')renderControl();if(id==='cash')loadCash();if(id==='salary')loadSalary();}
function orderCard(o){const src=o.source==='gbu'?'ГБУ':'Частный';const cat={standard:'Стандарт',vip:'Вип',elite:'Элит'}[o.category]||o.category;const missing=(Number(o.assigned_count||0)!==Number(o.people_count));return `<div class="card order ${missing&&o.status!=='cancelled'?'problem':''}"><h3>${src} №${o.daily_number} · ${o.issue_time.slice(0,5)}</h3><div class="meta"><b>${cat}</b> · ${o.people_count} чел.<br>Агент: ${esc(o.agent_name)} ${esc(o.agent_phone)}<br>Умерший: ${esc(o.deceased_name)}<br>📍 ${esc(o.route)}<br><span class="muted">Статус: ${esc(o.status)} · Состав ${o.assigned_count||0}/${o.people_count}</span></div>${o.status!=='cancelled'&&o.status!=='completed'?`<div class="actions"><button class="btn green small" onclick="autoAssign(${o.id})">⚡ Подобрать состав</button><button class="btn small" onclick="manualAssign(${o.id})">✍️ Вручную</button><button class="btn small" onclick="editOrder(${o.id})">Изменить</button><button class="btn small" onclick="copyOrder(${o.id})">📋 Копировать</button><button class="btn red small" onclick="cancelOrder(${o.id})">Удалить</button></div>`:''}</div>`}
async function init(){document.getElementById('day').value=new Date().toISOString().slice(0,10);try{me=await api('/api/me');document.getElementById('who').textContent=me.role==='owner'?'Владелец':'Помощник';document.getElementById('tabs').innerHTML=tabs.filter(([id])=>me.cash_visible||!['cash','salary'].includes(id)).map(([id,n],i)=>`<button class="tab ${i===0?'active':''}" data-id="${id}" onclick="setTab('${id}')">${n}</button>`).join('');await reloadAll()}catch(e){document.getElementById('overview').innerHTML=`<div class="card problem"><b>Нет доступа</b><br><span class="muted">Откройте диспетчерскую из Telegram через закреплённую кнопку.</span></div>`;document.getElementById('who').textContent='Нет доступа'}}
async function reloadAll(){try{const day=document.getElementById('day').value;dashboard=await api('/api/dashboard?day='+day);renderOverview();renderReadiness();renderOrders('private');renderOrders('gbu');renderControl()}catch(e){toast('Ошибка: '+e.message)}}
function renderOverview(){const r=dashboard.readiness.reduce((a,x)=>{a.total+=(+x.total||0);a.responded+=(+x.responded||0);a.nr+=(+x.not_responded||0);return a},{total:0,responded:0,nr:0});const probs=dashboard.control.problems.length;document.getElementById('overview').innerHTML=`<div class="grid"><div class="metric"><span class="muted">Ответили</span><b>${r.responded}/${r.total}</b></div><div class="metric"><span class="muted">Не отписались</span><b>${r.nr}</b></div><div class="metric"><span class="muted">Частные</span><b>${dashboard.private.length}</b></div><div class="metric"><span class="muted">ГБУ</span><b>${dashboard.gbu.length}</b></div></div><div class="card ${probs?'problem':'ok'}" style="margin-top:10px"><b>${probs?'Требует внимания: '+probs:'🟢 Всё под контролем'}</b>${probs?'<div class="muted" style="margin-top:4px">Откройте вкладку «Контроль».</div>':''}</div>`}
const gl={brigadier:'Бригадиры',main:'Основной',cashless:'Безнал',reserve:'Резерв'};
function renderReadiness(){const out=dashboard.readiness.map(g=>`<div class="card"><div class="row"><b>${gl[g.employee_group]||g.employee_group}</b><span>${g.responded}/${g.total}</span></div><div class="grid" style="margin-top:8px"><div class="metric click" onclick="showReady('${g.employee_group}','ready')"><span class="muted">Готов</span><b>${(+g.ready||0)+(+g.ready_car||0)}</b></div><div class="metric click" onclick="showReady('${g.employee_group}','main')"><span class="muted">На основной</span><b>${g.main||0}</b></div><div class="metric click" onclick="showReady('${g.employee_group}','off')"><span class="muted">Выходной</span><b>${g.off||0}</b></div><div class="metric click" onclick="showReady('${g.employee_group}','not_responded')"><span class="muted">Не отписались</span><b>${g.not_responded||0}</b></div></div></div>`).join('');document.getElementById('readiness').innerHTML=out||'<div class="card">Сотрудники ещё не добавлены.</div>'}
async function showReady(group,bucket){const day=document.getElementById('day').value;const people=await api(`/api/readiness?day=${day}&group=${group}&bucket=${bucket}`);openModal(`<h2>${gl[group]} · ${bucket}</h2>${people.map(p=>`<div class="person"><b>${esc(p.full_name)}</b> · ${esc(p.metro)}<br><span class="muted">Рост ${p.height_cm||'—'} ${p.has_car?'🚗':''}</span></div>`).join('')||'<div class="muted">Пусто</div>'}`)}
function renderOrders(src){const arr=src==='private'?dashboard.private:dashboard.gbu;document.getElementById(src).innerHTML=arr.map(orderCard).join('')||'<div class="card">Заказов нет.</div>'}
async function autoAssign(id){try{const r=await api(`/api/orders/${id}/autoassign`,{method:'POST'});if(!r.ok){toast(r.reason==='no_brigadier'?'Нет готового бригадира':'Не хватает подходящих сотрудников');return}toast('Состав назначен и отправлен бригадиру');await reloadAll()}catch(e){toast('Не удалось: '+e.message)}}
async function manualAssign(id){try{employees=await api('/api/employees');const o=await api('/api/orders/'+id);const br=employees.filter(e=>e.employee_group==='brigadier'&&!e.paused);const mem=employees.filter(e=>['main','cashless','reserve'].includes(e.employee_group)&&!e.paused);openModal(`<h2>Ручной состав · заказ №${o.daily_number}</h2><div class="field"><label>Бригадир</label><select id="mbrig">${br.map(e=>`<option value="${e.id}">${esc(e.full_name)} · ${e.height_cm||'—'} ${e.has_car?'🚗':''}</option>`).join('')}</select></div><div class="field"><label>Выберите ${o.people_count-1} сотрудников</label><div id="mpeople">${mem.map(e=>`<label class="selectperson"><input type="checkbox" value="${e.id}"> <span>${esc(e.full_name)} · ${esc(e.metro)} · ${e.height_cm||'—'} ${e.has_car?'🚗':''}</span></label>`).join('')}</div></div><div class="actions"><button class="btn gold" onclick="saveManual(${id},${o.people_count-1})">Состав готов</button><button class="btn" onclick="closeModal()">Отмена</button></div>`)}catch(e){toast(e.message)}}
async function saveManual(id,need){const ids=[...document.querySelectorAll('#mpeople input:checked')].map(x=>+x.value);if(ids.length!==need){toast('Нужно выбрать '+need+' сотрудников');return}const brig=+document.getElementById('mbrig').value;try{await api(`/api/orders/${id}/composition`,{method:'POST',body:JSON.stringify({brigadier_id:brig,member_ids:ids,manual:true})});closeModal();toast('Состав сохранён и отправлен бригадиру');await reloadAll()}catch(e){toast('Ошибка: '+e.message)}}
async function editOrder(id){const o=await api('/api/orders/'+id);openModal(`<h2>Изменить заказ №${o.daily_number}</h2><div class="field"><label>Время выдачи</label><input id="e_time" type="time" value="${o.issue_time.slice(0,5)}"></div><div class="field"><label>Время связи</label><input id="e_contact" type="time" value="${o.contact_time?o.contact_time.slice(0,5):''}"></div><div class="field"><label>Маршрут</label><textarea id="e_route">${esc(o.route)}</textarea></div><div class="field"><label>Количество</label><select id="e_people"><option ${o.people_count==4?'selected':''}>4</option><option ${o.people_count==6?'selected':''}>6</option></select></div><div class="field"><label>Рост-ориентир (необязательно)</label><input id="e_height" type="number" value="${o.target_height||''}"></div><div class="actions"><button class="btn gold" onclick="saveEdit(${id})">Сохранить</button><button class="btn" onclick="closeModal()">Отмена</button></div>`)}
async function saveEdit(id){const body={issue_time:document.getElementById('e_time').value,route:document.getElementById('e_route').value,people_count:+document.getElementById('e_people').value};const c=document.getElementById('e_contact').value;if(c)body.contact_time=c;const h=document.getElementById('e_height').value;if(h)body.target_height=+h;try{const r=await api('/api/orders/'+id,{method:'PATCH',body:JSON.stringify(body)});closeModal();toast(r.assignments_invalidated?'Сохранено. Состав снят для перепроверки.':'Сохранено');await reloadAll()}catch(e){toast(e.message)}}
async function copyOrder(id){try{await api(`/api/orders/${id}/copy`,{method:'POST'});toast('Копия создана с новым номером');await reloadAll()}catch(e){toast(e.message)}}
async function cancelOrder(id){if(!confirm('Отменить этот заказ?'))return;try{await api('/api/orders/'+id,{method:'DELETE'});toast('Заказ отменён');await reloadAll()}catch(e){toast(e.message)}}
async function loadEmployees(){try{employees=await api('/api/employees');document.getElementById('employees').innerHTML=`<div class="actions" style="margin-bottom:10px"><button class="btn gold" onclick="newEmployee()">+ Сотрудник</button></div>`+employees.map(e=>`<div class="card"><div class="row"><div><b>${esc(e.full_name)}</b><br><span class="muted">${esc(e.metro)} · ${e.height_cm||'—'} · ${gl[e.employee_group]||e.employee_group} ${e.has_car?'🚗':''}</span></div><button class="btn small" onclick="editEmployee(${e.id})">Изменить</button></div>${e.paused?'<div class="chip">⏸ Временно не использовать</div>':''}</div>`).join('')}catch(e){toast(e.message)}}
function employeeForm(e={}){return `<div class="field"><label>Telegram ID</label><input id="p_tg" type="number" value="${e.telegram_id||''}"></div><div class="field"><label>Имя</label><input id="p_name" value="${esc(e.full_name||'')}"></div><div class="field"><label>Метро</label><input id="p_metro" value="${esc(e.metro||'')}"></div><div class="field"><label>Рост</label><input id="p_height" type="number" value="${e.height_cm||''}"></div><div class="field"><label>Телефон</label><input id="p_phone" value="${esc(e.phone||'')}"></div><div class="field"><label>Группа</label><select id="p_group">${Object.entries(gl).map(([k,v])=>`<option value="${k}" ${e.employee_group===k?'selected':''}>${v}</option>`).join('')}</select></div><div class="field"><label><input id="p_car" type="checkbox" ${e.has_car?'checked':''}> Авто</label></div><div class="field"><label><input id="p_pause" type="checkbox" ${e.paused?'checked':''}> Временно не использовать</label></div>`}
function empBody(){return {telegram_id:+document.getElementById('p_tg').value,full_name:document.getElementById('p_name').value,metro:document.getElementById('p_metro').value,height_cm:+document.getElementById('p_height').value||null,phone:document.getElementById('p_phone').value,employee_group:document.getElementById('p_group').value,has_car:document.getElementById('p_car').checked,paused:document.getElementById('p_pause').checked}}
function newEmployee(){openModal(`<h2>Новый сотрудник</h2>${employeeForm()}<div class="actions"><button class="btn gold" onclick="saveNewEmployee()">Сохранить</button><button class="btn" onclick="closeModal()">Отмена</button></div>`)}
async function saveNewEmployee(){try{await api('/api/employees',{method:'POST',body:JSON.stringify(empBody())});closeModal();toast('Сотрудник добавлен');loadEmployees();reloadAll()}catch(e){toast(e.message)}}
function editEmployee(id){const e=employees.find(x=>x.id===id);openModal(`<h2>${esc(e.full_name)}</h2>${employeeForm(e)}<div class="actions"><button class="btn gold" onclick="saveEmployee(${id})">Сохранить</button><button class="btn" onclick="closeModal()">Отмена</button></div>`)}
async function saveEmployee(id){try{await api('/api/employees/'+id,{method:'PATCH',body:JSON.stringify(empBody())});closeModal();toast('Сохранено');loadEmployees();reloadAll()}catch(e){toast(e.message)}}
function problemText(p){const o=p.order||{};return {not_completed:'Не закрыт заказ',missing_photo:`Нет фото (${p.have||0}/${p.need||1})`,missing_cash:'Не внесена касса',no_composition:'Нет полного состава',no_contact_time:'Не задано время связи'}[p.kind]||p.kind+` · №${o.daily_number||''}`}
function renderControl(){if(!dashboard)return;const p=dashboard.control.problems;document.getElementById('control').innerHTML=p.length?p.map(x=>`<div class="card problem"><b>${problemText(x)}</b><br><span class="muted">${x.order?(x.order.source==='gbu'?'ГБУ':'Частный')+' №'+x.order.daily_number+' · '+x.order.work_date:''}</span></div>`).join(''):'<div class="card ok"><b>🟢 Всё под контролем</b><br><span class="muted">Нет незакрытых действий.</span></div>'}
async function loadCash(){if(!me?.cash_visible)return;try{const day=document.getElementById('day').value;const rows=await api('/api/cash?day='+day);document.getElementById('cash').innerHTML=rows.map(x=>`<div class="card"><b>${x.source==='gbu'?'ГБУ':'Частный'} №${x.daily_number}</b> · ${esc(x.brigadier_name||'')}<div class="big">${Number(x.amount||0).toLocaleString('ru-RU')} ₽</div><span class="muted">Откат ${x.rollback||0} · резерв ${x.reserve||0}</span></div>`).join('')||'<div class="card">Записей нет.</div>'}catch(e){toast(e.message)}}
async function loadSalary(){if(!me?.cash_visible)return;const day=new Date(document.getElementById('day').value);const d=day.getDate();const start=new Date(day);const end=new Date(day);if(d<=15){start.setDate(1);end.setDate(15)}else{start.setDate(16);end.setMonth(end.getMonth()+1,0)}const fmt=d=>d.toISOString().slice(0,10);try{const r=await api(`/api/salary/period?start=${fmt(start)}&end=${fmt(end)}`);document.getElementById('salary').innerHTML=`<div class="card ${r.rates_configured?'ok':'problem'}"><b>${r.rates_configured?'Ставки настроены':'Ставки пока не настроены'}</b><br><span class="muted">Точные ставки в исходных требованиях не были зафиксированы, поэтому они задаются владельцем отдельно и не выдуманы системой.</span></div>`+r.employees.map(e=>`<div class="card"><b>${esc(e.full_name)}</b> · ${esc(e.metro)}<div class="big">${Number(e.total||0).toLocaleString('ru-RU')} ₽</div><span class="muted">Заказов: ${e.orders.length} · корректировки ${e.adjustments||0}</span></div>`).join('')}catch(e){toast(e.message)}}
function openModal(html){document.getElementById('modalbox').innerHTML=html;document.getElementById('modal').classList.add('open')}
function closeModal(){document.getElementById('modal').classList.remove('open')}
document.getElementById('modal').addEventListener('click',e=>{if(e.target.id==='modal')closeModal()});document.getElementById('day').addEventListener('change',reloadAll);init();
</script>
</body></html>
